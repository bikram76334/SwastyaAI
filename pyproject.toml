[project]
name = "SwastyaAI"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-limiter",
    "python-dotenv",
    "gunicorn",
    "onnxruntime",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "torch",
    "torchvision",
    "grad-cam",
]

[tool.vercel]
entrypoint = "run:app"