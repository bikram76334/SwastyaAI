<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundus Eye-Side Labeler</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e8ef;--left:#0d6efd;--right:#d9534f;--uns:#6c757d;--ok:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
h1{font-size:22px;text-align:center;margin:14px 0}
.app{display:grid;grid-template-columns:300px 1fr 300px;gap:14px;padding:0 14px 14px;height:calc(100vh - 60px)}
.card{background:var(--card);border-radius:10px;padding:14px;overflow:auto;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500;color:var(--mute)}.row span{text-align:right;word-break:break-all}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;color:#fff;font-size:12px;font-weight:600}
.b-left{background:var(--left)}.b-right{background:var(--right)}.b-unsure{background:var(--uns)}.b-none{background:#adb5bd}
.center{display:flex;flex-direction:column;gap:10px;min-height:0}
.view{flex:1;min-height:0;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:zoom-in}
.view img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .08s}
.view.zoom{cursor:zoom-out}.view.zoom img{transform:scale(2.4)}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.act{padding:14px;border:0;border-radius:10px;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.act small{display:block;font-weight:400;opacity:.85;font-size:11px}
.act:active{transform:translateY(1px)}.act.sel{outline:4px solid #222}
.nav{display:flex;gap:8px;align-items:center}
.nav button,.nav input,select{padding:7px 10px;border:1px solid #c9d1dc;border-radius:7px;background:#fff;font:inherit}
.nav .pos{flex:1;text-align:center;font-weight:600}
.nav input{width:80px}
label{display:block;margin:10px 0 4px;color:var(--mute)}select{width:100%}
.prog{height:10px;background:#e3e8ef;border-radius:6px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--ok)}
.list div{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.list div:hover{background:#eef2f8}.list div.cur{background:#dbe7ff}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:20px;color:#fff;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}.toast.ok{background:var(--ok)}.toast.err{background:#c62828}
.sl{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px}.sl input{flex:1}
a.btn{display:block;text-align:center;padding:7px;border:1px solid #c9d1dc;border-radius:7px;color:var(--ink);text-decoration:none;margin-top:6px}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}.view{height:60vh;flex:none}}
</style></head><body>
<h1>Fundus Eye-Side Labeler</h1>
<div class="app">
 <div class="card" id="info"></div>
 <div class="center">
  <div class="view" id="view"><img id="img" alt=""></div>
  <div class="sl">Brightness <input type="range" id="br" min="60" max="220" value="100">
                  Contrast <input type="range" id="co" min="60" max="260" value="100"></div>
  <div class="bar">
   <button class="act" id="bL" style="background:var(--left)">LEFT eye<small>key L</small></button>
   <button class="act" id="bU" style="background:var(--uns)">UNSURE<small>key U</small></button>
   <button class="act" id="bR" style="background:var(--right)">RIGHT eye<small>key R</small></button>
  </div>
  <div class="nav">
   <button id="prev">&#9664; Previous</button><div class="pos" id="pos"></div><button id="next">Next &#9654;</button>
   <input id="goto" type="number" min="1" placeholder="#"><button id="go">Go</button>
  </div>
 </div>
 <div class="card">
  <b style="font-size:16px">Progress</b>
  <div class="prog"><i id="pbar"></i></div><div id="ptxt"></div><div id="pds" style="color:var(--mute);margin-top:4px"></div>
  <label>Dataset</label><select id="fds"><option value="all">All</option></select>
  <label>Show</label><select id="fst">
   <option value="all">All images</option><option value="unlabeled">Unlabeled only</option><option value="labeled">Labeled only</option>
   <option value="left">Left</option><option value="right">Right</option><option value="unsure">Unsure</option></select>
  <a class="btn" href="/export/train.csv">Download train CSV (left/right)</a>
  <a class="btn" href="/export/labels.csv">Download full labels CSV</a>
  <label>Nearby images</label><div class="list" id="list"></div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let items=[],pos=0,busy=false;
const cls=l=>'b-'+(l||'none'), txt=l=>l?l[0].toUpperCase()+l.slice(1):'Unlabeled';
function toast(m,t='ok'){const e=$('toast');e.textContent=m;e.className='toast show '+t;clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',1100)}
async function load(jumpFirstUnlabeled=true){
  const q=new URLSearchParams({dataset:$('fds').value,status:$('fst').value});
  const d=await (await fetch('/api/items?'+q)).json();
  items=d.items;
  if($('fds').options.length==1) d.datasets.forEach(x=>$('fds').add(new Option(x,x)));
  stats(d.stats);
  if(jumpFirstUnlabeled){const i=items.findIndex(x=>!x.label);pos=i<0?0:i}
  render();
}
function stats(s){
  const p=s.total?100*s.done/s.total:0;$('pbar').style.width=p+'%';
  $('ptxt').textContent=`${s.done} / ${s.total} labeled (${p.toFixed(1)}%)  -  L ${s.left} | R ${s.right} | ? ${s.unsure}`;
  $('pds').textContent=Object.entries(s.by_dataset).map(([k,v])=>`${k}: ${v.done}/${v.total}`).join('   ');
}
function render(){
  if(!items.length){$('info').innerHTML='<p>No images match this filter.</p>';$('img').removeAttribute('src');$('pos').textContent='0 / 0';$('list').innerHTML='';return}
  pos=Math.max(0,Math.min(pos,items.length-1));const it=items[pos];
  $('img').src='/img/'+it.id;$('view').classList.remove('zoom');
  $('pos').textContent=`${pos+1} / ${items.length}`;
  const name=it.path.split('/').pop();
  $('info').innerHTML=`<b style="font-size:16px">Image details</b>
   <div class="row"><b>Label</b><span><span class="badge ${cls(it.label)}">${txt(it.label)}</span></span></div>
   <div class="row"><b>Dataset</b><span>${it.ds}</span></div>
   <div class="row"><b>Filename</b><span>${name}</span></div>
   <div class="row"><b>Relative path</b><span>${it.path}</span></div>
   <div class="row"><b>Resolution</b><span id="res">...</span></div>
   <div class="row"><b>Image ID</b><span>${it.id}</span></div>`;
  $('img').onload=()=>{const r=$('res');if(r)r.textContent=$('img').naturalWidth+' x '+$('img').naturalHeight};
  ['bL','bU','bR'].forEach((b,i)=>$(b).classList.toggle('sel',it.label==['left','unsure','right'][i]));
  const a=Math.max(0,pos-12),z=Math.min(items.length,pos+13);
  $('list').innerHTML=items.slice(a,z).map((x,k)=>`<div class="${a+k==pos?'cur':''}" data-i="${a+k}"><span>${x.path.split('/').pop()}</span><span class="badge ${cls(x.label)}">${txt(x.label)}</span></div>`).join('');
  [1,2].forEach(n=>{const x=items[pos+n];if(x)new Image().src='/img/'+x.id});
}
async function setLabel(l){
  if(busy||!items.length)return;busy=true;const it=items[pos];
  try{
    const r=await fetch('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:it.path,label:l})});
    if(!r.ok)throw 0;const d=await r.json();it.label=l;stats(d.stats);
    toast(l?`Saved: ${txt(l)}`:'Label cleared');
    if(l&&pos<items.length-1)pos++;render();
  }catch(e){toast('SAVE FAILED - not recorded. Is the server running?','err')}
  busy=false;
}
const go=d=>{pos+=d;render()};
$('bL').onclick=()=>setLabel('left');$('bR').onclick=()=>setLabel('right');$('bU').onclick=()=>setLabel('unsure');
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('go').onclick=()=>{const n=parseInt($('goto').value);if(n>0){pos=n-1;render()}};
$('goto').onkeydown=e=>{if(e.key=='Enter')$('go').click()};
$('fds').onchange=$('fst').onchange=()=>load(true);
$('list').onclick=e=>{const d=e.target.closest('[data-i]');if(d){pos=+d.dataset.i;render()}};
$('view').onclick=()=>$('view').classList.toggle('zoom');
$('view').onmousemove=e=>{const v=$('view');if(v.classList.contains('zoom')){const r=v.getBoundingClientRect();
  $('img').style.transformOrigin=`${100*(e.clientX-r.left)/r.width}% ${100*(e.clientY-r.top)/r.height}%`}};
const filt=()=>$('img').style.filter=`brightness(${$('br').value}%) contrast(${$('co').value}%)`;
$('br').oninput=$('co').oninput=filt;
document.onkeydown=e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k=='l')setLabel('left');else if(k=='r')setLabel('right');else if(k=='u')setLabel('unsure');
  else if(k=='arrowleft')go(-1);else if(k=='arrowright')go(1);
  else if(k=='backspace'||k=='delete')setLabel(null);else if(k=='z')$('view').click();
};
load(true);
</script></body></html>
